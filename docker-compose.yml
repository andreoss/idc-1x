services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: idc_catalog
      POSTGRES_USER: idc
      POSTGRES_PASSWORD: idc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      PG_CONN: "host=db port=5432 user=idc dbname=idc_catalog password=idc"
      PORT: "8080"
      SEED_DIR: "/app/seed"
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
