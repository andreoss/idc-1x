name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: HLint
        run: nix develop -c hlint src app test
      - name: Build
        run: nix build -L
      - name: Tests
        run: nix develop -c sh -c "cabal update && cabal test all"
      - name: Weeder
        run: nix develop -c sh -c "cabal build all && weeder --hie-directory dist-newstyle"
